<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Kian!</title>
  <!-- Correct Google Font link -->
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #FFFFEE;
      color: #010091;
      font-family: 'Titan One', cursive;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .screen {
      display: none;
      text-align: center;
      flex-direction: column;
    }
    #screen1 h1 {
      font-family: 'Titan One', cursive;
      font-size: 48px;
      color: #010091;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
    #videoContainer {
      display: none;
    }
  </style>
</head>
<body>

<!-- First screen -->
<div id="screen1" class="screen" style="display: flex;">
  <h1>Happy Birthday Kian!</h1>
  <button onclick="goToScreen2()">Continue</button>
</div>

<!-- Second screen -->
<div id="screen2" class="screen">
  <h2>Play video?</h2>
  <button onclick="playVideo()">Yes</button>
  <button onclick="noVideo()">No</button>
</div>

<!-- Video Container -->
<div id="videoContainer" class="screen">
  <video id="birthdayVideo" width="800" controls>
    <source src="birthday.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
</div>

<!-- JavaScript to handle navigation -->
<script>
  function goToScreen2() {
    document.getElementById('screen1').style.display = 'none';
    document.getElementById('screen2').style.display = 'flex';
  }

  function playVideo() {
    document.getElementById('screen2').style.display = 'none';
    document.getElementById('videoContainer').style.display = 'flex';
    document.getElementById('birthdayVideo').play();
  }

  function noVideo() {
    document.getElementById('screen2').innerHTML = "<h2>Maybe next time!</h2>";
  }
</script>

</body>
</html>
